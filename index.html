<style>
html,body{margin:0}
body.locked{background:#FDF1F3;overflow:hidden}
#gate{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;color:#34131F;font-family:"Nunito",system-ui,sans-serif;
  background:radial-gradient(60vmax 44vmax at 6% -6%,#FFD9E3 0%,rgba(255,217,227,0) 62%),radial-gradient(56vmax 40vmax at 104% 6%,#EDE2FB 0%,rgba(237,226,251,0) 60%),radial-gradient(70vmax 50vmax at 50% 112%,#FFE6D3 0%,rgba(255,230,211,0) 62%),#FDF1F3;
  transition:opacity .9s ease,transform 1.1s cubic-bezier(.2,.75,.2,1)}
#gate.out{opacity:0;transform:scale(1.04);pointer-events:none}
#gcv{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
#gate .gbox{position:relative;z-index:2;display:grid;justify-items:center;gap:12px;text-align:center;padding:calc(env(safe-area-inset-top,0px) + 16px) 22px calc(env(safe-area-inset-bottom,0px) + 16px);width:min(420px,100%);box-sizing:border-box}
/* buket */
#gate .bq{width:min(230px,58vw);height:auto;overflow:visible;margin-bottom:-6px}
#gate .bq .st{fill:none;stroke:#4E8B57;stroke-width:4.5;stroke-linecap:round;stroke-dasharray:240;stroke-dashoffset:240;animation:grow 1.5s cubic-bezier(.3,.7,.2,1) forwards}
#gate .bq .st.s2{animation-delay:.2s}#gate .bq .st.s3{animation-delay:.35s}
#gate .bq .lf{fill:#7DB06F;transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);animation:pop .7s cubic-bezier(.3,1.5,.5,1) forwards}
#gate .bq .lf.l1{animation-delay:.7s}#gate .bq .lf.l2{animation-delay:.85s}
#gate .bq .hd{transform-box:fill-box;transform-origin:50% 100%;transform:scale(0);animation:pop .8s cubic-bezier(.3,1.6,.5,1) forwards}
#gate .bq .h1{animation-delay:1.05s}#gate .bq .h2{animation-delay:1.2s}#gate .bq .h3{animation-delay:1.3s}
#gate .bq .sw{transform-box:fill-box;transform-origin:50% 100%;animation:sway 5s ease-in-out 2s infinite}
#gate .bq .sw.b{animation-duration:6s;animation-delay:2.4s}#gate .bq .sw.c{animation-duration:5.5s;animation-delay:2.2s}
#gate .bq .pl,#gate .bq .pr,#gate .bq .pc{transform-box:fill-box;transition:transform 1.4s cubic-bezier(.2,.75,.2,1)}
#gate .bq .pl{transform-origin:90% 95%}#gate .bq .pr{transform-origin:10% 95%}#gate .bq .pc{transform-origin:50% 100%}
#gate.open .bq .pl{transform:rotate(-30deg)}#gate.open .bq .pr{transform:rotate(30deg)}#gate.open .bq .pc{transform:scale(1.1)}
#gate .bq .bow{opacity:0;animation:fade .6s ease 1.4s forwards}
#gate .bq .glow{opacity:0;transition:opacity 1.2s}#gate.open .bq .glow{opacity:1}
@keyframes grow{to{stroke-dashoffset:0}}
@keyframes pop{to{transform:scale(1)}}
@keyframes fade{to{opacity:1}}
@keyframes sway{0%,100%{transform:rotate(0)}50%{transform:rotate(2.5deg)}}
@keyframes rise{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:none}}
#gate .rise{opacity:0;animation:rise .8s cubic-bezier(.2,.75,.2,1) forwards}
#gate .d1{animation-delay:.5s}#gate .d2{animation-delay:.7s}#gate .d3{animation-delay:.9s}#gate .d4{animation-delay:1.1s}
#gate h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(38px,10vw,50px);margin:0;letter-spacing:-.01em;line-height:1.05}
#gate h1 span{color:#C9233F}
#gate .gsub{font-family:"Caveat",cursive;font-size:25px;color:#8A6473;margin:-4px 0 0;line-height:1.1}
#gate .gdays{display:inline-flex;align-items:center;gap:8px;margin:2px 0 6px;padding:7px 14px;border-radius:999px;background:rgba(255,250,250,.85);border:1px solid #F0D5DC;font-size:13px;font-weight:800;color:#5B3444;box-shadow:0 10px 24px -18px rgba(120,30,60,.5)}
#gate .gdays i{width:8px;height:8px;border-radius:50%;background:#E8577A;box-shadow:0 0 0 4px rgba(232,87,122,.18)}
#gate form{display:grid;gap:12px;width:100%;justify-items:center}
#gate .pin{position:relative;display:block;width:min(318px,100%)}
#gate #pw{position:absolute;inset:0;width:100%;height:100%;opacity:.01;font-size:16px;border:none;background:none;color:transparent;caret-color:transparent;z-index:2;letter-spacing:0;-webkit-text-fill-color:transparent}
#gate .slots{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
#gate .slots i{height:58px;border-radius:16px;background:rgba(255,250,250,.92);border:1.5px solid #E6C0CA;display:grid;place-items:center;font-style:normal;font-family:"Young Serif",Georgia,serif;font-size:27px;color:#34131F;box-shadow:0 10px 20px -16px rgba(120,30,60,.55);transition:border-color .2s,transform .2s,box-shadow .2s}
#gate .slots i.f{border-color:#E8577A}
#gate .slots i.cur{border-color:#C9233F;box-shadow:0 0 0 4px rgba(232,87,122,.18)}
#gate .slots i.cur::after{content:"";width:2px;height:26px;background:#C9233F;animation:blink 1s steps(1) infinite}
@keyframes blink{50%{opacity:0}}
#gate.ok .slots i{border-color:#3FB46B;background:#F1FBF3}
#gate .go{font:inherit;font-weight:800;font-size:16px;border:none;border-radius:999px;padding:14px 34px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#E8577A,#C9233F);box-shadow:0 14px 30px -14px rgba(201,35,63,.8)}
#gate .go:active{transform:scale(.97)}
#gate .hint{font-size:13.5px;color:#8A6473;line-height:1.45;margin:0}
#gate .msg{min-height:1.4em;font-weight:800;color:#C9233F;font-size:14.5px;margin:0}
#gate .shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#gate .songs{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
#gate .song{font:inherit;font-weight:800;font-size:12.5px;border-radius:999px;padding:7px 12px;cursor:pointer;border:1px solid #E6C0CA;background:rgba(255,250,250,.8);color:#5B3444}
#gate .song[aria-pressed="true"]{background:#34131F;color:#fff;border-color:#34131F}
#gate .slbl{font-size:11px;letter-spacing:.16em;text-transform:uppercase;font-weight:900;color:#3F7A4C;margin:6px 0 -4px}
/* açılış */
#gate .lock{display:grid;justify-items:center;gap:12px;width:100%;transition:opacity .45s,transform .45s}
#gate.open .lock,#gate.auto .lock{opacity:0;transform:translateY(10px);pointer-events:none}
#gate.auto .lock{display:none}
#gate .wel{position:absolute;left:0;right:0;top:calc(50% + min(120px,22vw));z-index:3;text-align:center;pointer-events:none;padding:0 16px}
#gate .big{font-family:"Young Serif",Georgia,serif;font-size:clamp(52px,14vw,96px);line-height:1;color:#34131F}
#gate .big span{display:inline-block;opacity:0;transform:translateY(.35em);transition:opacity .5s,transform .6s cubic-bezier(.2,.75,.2,1)}
#gate .big span.on{opacity:1;transform:none}
#gate .big span.r{color:#C9233F}
#gate .wsub{font-family:"Caveat",cursive;font-size:clamp(24px,6vw,30px);color:#8A6473;margin-top:8px;opacity:0;transition:opacity .8s}
#gate .wsub.on{opacity:1}
#gate.auto .bq{width:min(200px,52vw)}
#gate.auto .bq .st{animation-duration:.8s}#gate.auto .bq .lf,#gate.auto .bq .hd{animation-duration:.5s}
#gate.auto .bq .lf.l1{animation-delay:.3s}#gate.auto .bq .lf.l2{animation-delay:.35s}#gate.auto .bq .h1{animation-delay:.4s}#gate.auto .bq .h2{animation-delay:.48s}#gate.auto .bq .h3{animation-delay:.55s}#gate.auto .bq .bow{animation-delay:.6s}
#mp{display:none!important}
@media (max-height:640px){#gate .bq{width:min(170px,40vw)}#gate .slots i{height:50px}#gate .gbox{gap:9px}}
@media (prefers-reduced-motion:reduce){#gate *{transition-duration:.01ms!important;animation-duration:.01ms!important;animation-delay:0s!important}}
</style>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const te=new TextEncoder(), td=new TextDecoder();
let KEY=null;
async function unwrap(pw){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  for(const w of WRAPS){
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(w.s),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    try{const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(w.iv)},k,b64(w.c));return new Uint8Array(raw);}catch(e){}
  }
  return null;
}
async function useRaw(raw){
  KEY=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},KEY,b64(PAYLOAD.c));
  return JSON.parse(td.decode(pt));
}
/* media decryption: elements get src "enc:foto/x.jpg.bin" */
const cache=new Map();
function decUrl(path){
  if(!cache.has(path)) cache.set(path,(async()=>{
    const buf=new Uint8Array(await (await fetch(path)).arrayBuffer());
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},KEY,buf.slice(12));
    const type=/\.mp4\.bin$/.test(path)?'video/mp4':/\.mp3\.bin$/.test(path)?'audio/mpeg':'image/jpeg';
    return URL.createObjectURL(new Blob([pt],{type}));
  })());
  return cache.get(path);
}
const io=new IntersectionObserver(es=>{for(const e of es){if(!e.isIntersecting)continue;io.unobserve(e.target);const el=e.target,p=el.dataset.enc;decUrl(p).then(u=>{el.src=u;}).catch(()=>{});}},{rootMargin:'600px'});
function grab(el){
  const s=el.getAttribute&&el.getAttribute('src');

}

(()=>{
/* yaprak yağmuru */
const cv=document.getElementById('gcv'),ctx=cv.getContext('2d');let W,H,parts=[];
const COLS=['#F7A8BE','#FBCFDA','#FFD9A8','#D9C6F5','#F58AC0','#FFFFFF','#E8577A'];
function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
size();addEventListener('resize',size);
for(let i=0;i<22;i++)parts.push({x:Math.random()*W,y:Math.random()*H,s:4+Math.random()*6,vy:9+Math.random()*16,vx:0,r:Math.random()*6,vr:(Math.random()-.5),c:COLS[i%COLS.length],a:.55});
function burst(n){const cx=W/2,cy=H*.34;for(let i=0;i<(n||110);i++){const a=Math.random()*6.28,sp=140+Math.random()*480;parts.push({x:cx,y:cy,s:5+Math.random()*8,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-220,r:Math.random()*6,vr:(Math.random()-.5)*8,c:COLS[i%COLS.length],a:1,g:1});}}
let last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;ctx.clearRect(0,0,W,H);
  for(const p of parts){if(p.g){p.vy+=480*dt;p.vx*=.99;p.a-=dt*.4;}else{p.vx=Math.sin(now/1100+p.r)*14;if(p.y>H+20){p.y=-20;p.x=Math.random()*W;}}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;if(p.a<=0)continue;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.c;ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.55,0,0,6.283);ctx.fill();ctx.restore();}
  parts=parts.filter(p=>!p.g||p.a>0);
  const g=document.getElementById('gate');if(g&&!g.dataset.done)requestAnimationFrame(loop);})(last);

  mp.querySelector('.nm').textContent=pick<0?'Müzik kapalı':SONGS[pick].n;
}

let busy=false;
async function submit(){
  if(busy)return;
  const box=document.getElementById('gbox'),msg=document.getElementById('msg'),gate=document.getElementById('gate');
  if(pick>=0)unlockAudio();
  const v=pw.value.replace(/\D/g,'');
  if(v.length<6){msg.textContent='6 rakam olmalı 🙂';pw.focus();return;}
  busy=true;msg.textContent='Açılıyor…';
  const raw=await unwrap(v);
  if(!raw){busy=false;msg.textContent='Olmadı, bir daha dene 🌷';const f=document.querySelector('#gate .pin');f.classList.remove('shake');void f.offsetWidth;f.classList.add('shake');pw.value='';drawSlots();pw.focus();return;}
  gate.classList.add('ok');
  try{localStorage.setItem('ba-k',btoa(String.fromCharCode(...raw)));}catch(e){}
  msg.textContent='';
  openSeq(await useRaw(raw));
}
document.getElementById('gf').addEventListener('submit',e=>{e.preventDefault();submit();});
(async()=>{let s=null;try{s=localStorage.getItem('ba-k');}catch(e){}
  if(!s){document.getElementById('gate').classList.remove('auto');setTimeout(()=>pw.focus(),900);return;}
  try{const site=await useRaw(b64(s));site.__auto=1;openSeq(site);}catch(e){document.getElementById('gate').classList.remove('auto');try{localStorage.removeItem('ba-k');}catch(x){}}
})();
})();
</script>
