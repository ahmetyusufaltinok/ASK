<style>
html,body{margin:0}
body.locked{background:#2A0F19}
#gate{position:fixed;inset:0;z-index:1000;display:grid;place-items:center;overflow:hidden;color:#FFF4F6;font-family:"Nunito",system-ui,sans-serif;
  background:radial-gradient(90vmax 70vmax at 50% 38%,#6B1F3D 0%,#3A1224 45%,#1E0A12 100%);transition:opacity 1.1s ease,transform 1.4s cubic-bezier(.2,.75,.2,1)}
#gate.out{opacity:0;transform:scale(1.08);pointer-events:none}
#gcv{position:absolute;inset:0;width:100%;height:100%}
#gate .gbox{position:relative;z-index:2;display:grid;justify-items:center;gap:14px;text-align:center;padding:24px 20px;width:min(420px,100%);box-sizing:border-box}
#gate .bud{width:150px;height:190px;overflow:visible;filter:drop-shadow(0 18px 40px rgba(255,90,130,.35))}
#gate .bud .pl,#gate .bud .pr{transform-box:fill-box;transition:transform 1.6s cubic-bezier(.2,.75,.2,1)}
#gate .bud .pl{transform-origin:90% 95%}#gate .bud .pr{transform-origin:10% 95%}
#gate .bud .pc{transform-box:fill-box;transform-origin:50% 100%;transition:transform 1.6s cubic-bezier(.2,.75,.2,1)}
#gate.open .bud .pl{transform:rotate(-28deg)}#gate.open .bud .pr{transform:rotate(28deg)}#gate.open .bud .pc{transform:scale(1.08)}
#gate .bud .glow{opacity:0;transition:opacity 1.2s}#gate.open .bud .glow{opacity:1}
#gate .busy .bud{animation:pulse 1s ease-in-out infinite}
@keyframes pulse{50%{transform:scale(1.05)}}
#gate .gbox h1{font-family:"Young Serif",Georgia,serif;font-weight:400;font-size:clamp(34px,8vw,46px);margin:0;letter-spacing:-.01em}
#gate .gsub{font-family:"Caveat",cursive;font-size:24px;color:#F7CDD7;margin:-6px 0 4px}
#gate form{display:grid;gap:10px;width:100%}
#gate #pw{font:inherit;font-size:26px;font-weight:800;letter-spacing:.28em;text-align:center;padding:14px 12px;border-radius:18px;border:1px solid rgba(247,205,215,.35);background:rgba(255,255,255,.08);color:#fff;outline:none;width:100%;box-sizing:border-box}
#gate #pw::placeholder{color:rgba(247,205,215,.45);letter-spacing:.12em;font-size:18px;font-weight:700}
#gate #pw:focus{border-color:#F7A8BE;box-shadow:0 0 0 4px rgba(247,168,190,.18)}
#gate .go{font:inherit;font-weight:800;font-size:16px;border:none;border-radius:999px;padding:14px 20px;cursor:pointer;color:#fff;background:linear-gradient(135deg,#E8577A,#C9233F);box-shadow:0 14px 30px -12px rgba(232,87,122,.8)}
#gate .go:active{transform:scale(.98)}
#gate .hint{font-size:13.5px;color:rgba(247,205,215,.75);line-height:1.45}
#gate .msg{min-height:1.4em;font-weight:700;color:#FFB3C5;font-size:14.5px}
#gate .shake{animation:shake .45s}
@keyframes shake{20%,60%{transform:translateX(-9px)}40%,80%{transform:translateX(9px)}}
#gate .songs{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
#gate .song{font:inherit;font-weight:800;font-size:13.5px;border-radius:999px;padding:8px 14px;cursor:pointer;border:1px solid rgba(247,205,215,.35);background:rgba(255,255,255,.06);color:#F7CDD7}
#gate .song[aria-pressed="true"]{background:#FFF4F6;color:#5B1A33;border-color:#FFF4F6}
#gate .slbl{font-size:12.5px;letter-spacing:.14em;text-transform:uppercase;font-weight:800;color:rgba(247,205,215,.7);margin-top:4px}
#gate.open .songs,#gate.open .slbl{opacity:0;transition:opacity .4s;pointer-events:none}
#mp{position:fixed;left:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));z-index:70;display:flex;align-items:center;gap:6px;padding:6px 8px 6px 6px;border-radius:999px;background:rgba(52,19,31,.92);color:#fff;font-family:"Nunito",system-ui,sans-serif;box-shadow:0 14px 30px -12px rgba(0,0,0,.6);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px)}
#mp button{font:inherit;border:none;cursor:pointer;color:#fff;background:transparent;border-radius:999px}
#mp .pp{width:38px;height:38px;background:linear-gradient(135deg,#E8577A,#C9233F);font-size:15px;display:grid;place-items:center}
#mp .nm{font-weight:800;font-size:13px;padding:0 6px;white-space:nowrap}
#mp .sw{font-size:12px;font-weight:800;padding:7px 10px;background:rgba(255,255,255,.12)}
#mp .eq{display:inline-flex;gap:2px;align-items:flex-end;height:14px;margin-left:2px}
#mp .eq i{width:3px;background:#FBB2C6;border-radius:2px;height:4px}
#mp.on .eq i{animation:eq .9s ease-in-out infinite}#mp.on .eq i:nth-child(2){animation-delay:.2s}#mp.on .eq i:nth-child(3){animation-delay:.4s}
@keyframes eq{50%{height:14px}}
#gate .gate-big{position:absolute;left:0;right:0;top:58%;z-index:3;font-family:"Young Serif",Georgia,serif;font-size:clamp(54px,14vw,120px);text-align:center;pointer-events:none}
#gate .gate-big span{display:inline-block;opacity:0;transform:translateY(.4em);transition:opacity .6s,transform .7s cubic-bezier(.2,.75,.2,1)}
#gate .gate-big span.on{opacity:1;transform:none}
#gate.open form,#gate.open .hint,#gate.open .msg,#gate.open .gsub{opacity:0;transition:opacity .4s;pointer-events:none}

body.locked{background:#0B0909}
#gate{background:radial-gradient(100vmax 80vmax at 50% 30%,#1A1413 0%,#0B0909 55%,#070606 100%);color:#F2EBDF;font-family:"Manrope",system-ui,sans-serif}
#gate::after{content:"";position:absolute;inset:14px;border:1px solid rgba(242,235,223,.08);pointer-events:none}
#gate .gbox{gap:16px;width:min(400px,100%)}
#gate .bud{width:84px;height:108px;filter:none;margin-bottom:-6px}
#gate .bud path{fill:none!important;stroke:#C9A876;stroke-width:1.2;stroke-dasharray:300;stroke-dashoffset:300;animation:draw 2.6s cubic-bezier(.16,1,.3,1) forwards}
#gate .bud path:nth-of-type(2){animation-delay:.3s}#gate .bud g path{animation-delay:.6s}
#gate .bud .glow{display:none}
@keyframes draw{to{stroke-dashoffset:0}}
#gate .gmono{margin:0;font-family:"Cormorant Garamond",serif;font-size:13px;letter-spacing:.5em;text-transform:uppercase;color:#8E857A}
#gate .gmono em{font-style:italic;color:#C9A876;letter-spacing:0;font-size:18px;text-transform:none}
#gate .gbox h1{font-family:"Cormorant Garamond",Georgia,serif;font-weight:300;font-style:italic;font-size:clamp(46px,11vw,64px);letter-spacing:-.01em;line-height:1}
#gate .gsub{font-family:"Manrope",sans-serif;font-size:10px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:#8E857A;margin:0 0 18px}
#gate .slbl{font-size:10px;letter-spacing:.3em;font-weight:600;color:#5E5751;margin:0}
#gate .songs{gap:0;border:1px solid rgba(242,235,223,.14)}
#gate .song{font-weight:600;font-size:10px;letter-spacing:.16em;text-transform:uppercase;border-radius:0;padding:11px 14px;border:none;border-right:1px solid rgba(242,235,223,.14);background:none;color:#CFC6B8}
#gate .song:last-child{border-right:none}
#gate .song[aria-pressed="true"]{background:#F2EBDF;color:#0B0909}
#gate form{gap:14px;margin-top:10px}
#gate #pw{font-family:"Cormorant Garamond",serif;font-size:34px;font-weight:300;letter-spacing:.35em;padding:10px 0;border:none;border-bottom:1px solid rgba(242,235,223,.25);border-radius:0;background:none;color:#F2EBDF}
#gate #pw::placeholder{font-family:"Manrope",sans-serif;color:rgba(242,235,223,.25);letter-spacing:.4em;font-size:13px;font-weight:500}
#gate #pw:focus{border-color:#C9A876;box-shadow:none}
#gate .go{font-weight:600;font-size:11px;letter-spacing:.28em;text-transform:uppercase;border-radius:0;padding:17px 20px;color:#0B0909;background:#C9A876;box-shadow:none;transition:background .4s}
#gate .go:hover{background:#F2EBDF}
#gate .hint{font-size:11px;letter-spacing:.06em;color:#5E5751}
#gate .msg{color:#D0566C;font-weight:500;font-size:13px}
#gate .gate-big{font-family:"Cormorant Garamond",serif;font-weight:300;font-style:italic;color:#E3CBA0;font-size:clamp(64px,17vw,150px);top:52%}
#mp{background:rgba(17,14,14,.92);border:1px solid rgba(242,235,223,.18);font-family:"Manrope",sans-serif}
#mp .pp{background:#C9A876;color:#0B0909}
#mp .eq i{background:#E3CBA0}
@media (prefers-reduced-motion:reduce){#gate *{transition-duration:.01ms!important;animation:none!important}}
</style>
</head>

const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
const te=new TextEncoder(), td=new TextDecoder();
let KEY=null;
async function unwrap(pw){
  const base=await crypto.subtle.importKey('raw',te.encode(pw),'PBKDF2',false,['deriveKey']);
  for(const w of WRAPS){
    const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(w.s),iterations:ITER,hash:'SHA-256'},base,{name:'AES-GCM',length:256},false,['decrypt']);
    try{const raw=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(w.iv)},k,b64(w.c));return new Uint8Array(raw);}catch(e){}
  }
  return null;

async function useRaw(raw){
  KEY=await crypto.subtle.importKey('raw',raw,'AES-GCM',false,['decrypt']);
  const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(PAYLOAD.iv)},KEY,b64(PAYLOAD.c));
  return JSON.parse(td.decode(pt));
}
/* media decryption: elements get src "enc:foto/x.jpg.bin" */
const cache=new Map();
function decUrl(path){
  if(!cache.has(path)) cache.set(path,(async()=>{
    const buf=new Uint8Array(await (await fetch(path)).arrayBuffer());
    const pt=await crypto.subtle.decrypt({name:'AES-GCM',iv:buf.slice(0,12)},KEY,buf.slice(12));
    const type=/\.mp4\.bin$/.test(path)?'video/mp4':/\.mp3\.bin$/.test(path)?'audio/mpeg':'image/jpeg';
    return URL.createObjectURL(new Blob([pt],{type}));
  })());
  return cache.get(path);
}

function grab(el){
  const s=el.getAttribute&&el.getAttribute('src');
  if(s&&s.startsWith('enc:')){el.dataset.enc=s.slice(4).split('#')[0];el.removeAttribute('src');io.observe(el);}
}
new MutationObserver(ms=>{for(const m of ms){for(const n of m.addedNodes){if(n.nodeType!==1)continue;grab(n);n.querySelectorAll&&n.querySelectorAll('img[src^="enc:"],video[src^="enc:"]').forEach(grab);}if(m.type==='attributes')grab(m.target);}}).observe(document.documentElement,{childList:true,subtree:true,attributes:true,attributeFilter:['src']});

/* petals */
const cv=document.getElementById('gcv'),ctx=cv.getContext('2d');let W,H,parts=[],burstT=0;
const COLS=['#C9A876','#E3CBA0','#F2EBDF','#8C7355','#B8935F','#E3CBA0','#F2EBDF'];
function size(){const d=Math.min(2,devicePixelRatio||1);W=innerWidth;H=innerHeight;cv.width=W*d;cv.height=H*d;ctx.setTransform(d,0,0,d,0,0);}
size();addEventListener('resize',size);
for(let i=0;i<30;i++)parts.push({x:Math.random()*W,y:Math.random()*H,s:.8+Math.random()*1.8,vy:10+Math.random()*18,vx:0,r:Math.random()*6,vr:(Math.random()-.5),c:COLS[i%7],a:.35});
function burst(){const cx=W/2,cy=H*.36;for(let i=0;i<120;i++){const a=Math.random()*6.28,sp=150+Math.random()*520;parts.push({x:cx,y:cy,s:1+Math.random()*2.6,vx:Math.cos(a)*sp,vy:Math.sin(a)*sp-240,r:Math.random()*6,vr:(Math.random()-.5)*8,c:COLS[i%7],a:1,g:1});}}
let last=performance.now();
(function loop(now){const dt=Math.min(.05,(now-last)/1000);last=now;ctx.clearRect(0,0,W,H);
  for(const p of parts){if(p.g){p.vy+=520*dt;p.vx*=.99;p.a-=dt*.35;}else{p.vx=Math.sin(now/1000+p.r)*14;if(p.y>H+20){p.y=-20;p.x=Math.random()*W;}}
    p.x+=p.vx*dt;p.y+=p.vy*dt;p.r+=p.vr*dt;if(p.a<=0)continue;
    ctx.save();ctx.translate(p.x,p.y);ctx.rotate(p.r);ctx.globalAlpha=Math.max(0,p.a);ctx.fillStyle=p.c;ctx.beginPath();ctx.ellipse(0,0,p.s,p.s*.55,0,0,6.283);ctx.fill();ctx.restore();}
  parts=parts.filter(p=>!p.g||p.a>0);
  const g=document.getElementById('gate');if(g&&!g.dataset.done)requestAnimationFrame(loop);})(last);

function inject(site){
  const st=document.createElement('style');st.textContent=site.css;document.head.appendChild(st);
  const wrap=document.createElement('div');wrap.innerHTML=site.body;
  const gate=document.getElementById('gate');
  while(wrap.firstChild)document.body.insertBefore(wrap.firstChild,gate);
  const sc=document.createElement('script');sc.textContent='window.__MANIFEST='+JSON.stringify(site.manifest)+';\n'+site.js;
  document.body.appendChild(sc);
}
async function openSeq(site){
  const gate=document.getElementById('gate'),box=document.getElementById('gbox'),big=document.getElementById('big');
  inject(site);
  if(!site.__auto && pick>=0) playSong(pick,true); else ui();
  box.classList.remove('busy');gate.classList.add('open');
  await wait(700);burst();
  let n=0;while(new Date(Date.UTC(2026,n+1,26))<=new Date())n++;n=Math.max(8,n);
  const word=n+'. Ayımız';
  [...word].forEach((ch,i)=>{const s=document.createElement('span');s.textContent=ch===' '?' ':ch;big.appendChild(s);setTimeout(()=>s.classList.add('on'),120+i*90);});
  await wait(1900+word.length*90);
  gate.classList.add('out');document.body.classList.remove('locked');
  await wait(1200);gate.dataset.done=1;gate.remove();
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));
const SONGS=[{id:'yeniden',n:'Yalın · Yeniden',f:'muzik/yeniden.mp3.bin'},{id:'ben-bilmem',n:'Yalın · Ben Bilmem',f:'muzik/ben-bilmem.mp3.bin'}];
let pick=0; try{const v=localStorage.getItem('ba-song'); if(v!==null)pick=+v;}catch(e){}
const audio=new Audio(); audio.loop=true; audio.preload='auto';
const SILENT='data:audio/wav;base64,UklGRiQAAABXQVZFZm10IBAAAAABAAEAESsAACJWAAACABAAZGF0YQAAAAA=';
function renderSongs(){const b=document.getElementById('songs');b.textContent='';
  [...SONGS.map((x,i)=>[i,x.n.split(' · ')[1]]),[-1,'Sessiz']].forEach(([i,l])=>{const e=document.createElement('button');e.type='button';e.className='song';e.textContent=(i>=0?'♪ ':'')+l;e.setAttribute('aria-pressed',String(pick===i));e.onclick=()=>{pick=i;renderSongs();};b.appendChild(e);});}
renderSongs();
function unlockAudio(){try{audio.src=SILENT;const p=audio.play();p&&p.catch(()=>{});}catch(e){}}
async function playSong(i,auto){
  pick=i;try{localStorage.setItem('ba-song',String(i));}catch(e){}
  if(i<0){audio.pause();ui();return;}
  const u=await decUrl(SONGS[i].f); audio.src=u; audio.currentTime=0;
  if(auto){try{await audio.play();}catch(e){}} ui();
}
function ui(){let mp=document.getElementById('mp');
  if(!mp){mp=document.createElement('div');mp.id='mp';mp.setAttribute('aria-label','Müzik');
    mp.innerHTML='<button class="pp" type="button" aria-label="Çal / durdur"></button><span class="nm"></span><span class="eq" aria-hidden="true"><i></i><i></i><i></i></span><button class="sw" type="button">Şarkıyı değiştir</button>';
    mp.querySelector('.pp').onclick=async()=>{if(pick<0)pick=0; if(!audio.src||audio.src===SILENT||!audio.src.startsWith('blob:'))await playSong(pick,true); else if(audio.paused)await audio.play().catch(()=>{}); else audio.pause(); ui();};
    mp.querySelector('.sw').onclick=()=>playSong(((pick<0?0:pick)+1)%SONGS.length,true);
    audio.addEventListener('play',ui);audio.addEventListener('pause',ui);
    document.body.appendChild(mp);}
  const on=!audio.paused&&audio.src.startsWith('blob:');
  mp.classList.toggle('on',on); mp.querySelector('.pp').textContent=on?'❚❚':'▶';
  mp.querySelector('.nm').textContent=pick<0?'Müzik kapalı':SONGS[pick].n;
}
document.getElementById('gf').addEventListener('submit',async e=>{
  e.preventDefault();
  const box=document.getElementById('gbox'),msg=document.getElementById('msg');
  if(pick>=0)unlockAudio();
  const pw=document.getElementById('pw').value.replace(/\D/g,'');
  if(pw.length<6){msg.textContent='6 rakam olmalı 🙂';return;}
  box.classList.add('busy');msg.textContent='Açılıyor…';
  const raw=await unwrap(pw);
  if(!raw){box.classList.remove('busy');msg.textContent='Olmadı, bir daha dene 🌷';box.classList.remove('shake');void box.offsetWidth;box.classList.add('shake');return;}
  try{localStorage.setItem('ba-k',btoa(String.fromCharCode(...raw)));}catch(e){}
  msg.textContent='';
  openSeq(await useRaw(raw));
});
(async()=>{let s=null;try{s=localStorage.getItem('ba-k');}catch(e){}
  if(!s){document.getElementById('pw').focus();return;}
  try{document.getElementById('gbox').classList.add('busy');const site=await useRaw(b64(s));site.__auto=1;openSeq(site);}catch(e){document.getElementById('gbox').classList.remove('busy');try{localStorage.removeItem('ba-k');}catch(x){}}
})();
</script>
